<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro | CRM na Mão</title>
  <meta name="description" content="Preencha seus dados e descreva o produto desejado para que nossa equipe entre em contato." />
  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,600;1,700&family=Inter+Tight:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header" id="header">
    <div class="container header-inner">
      <a href="index.html" class="brand" aria-label="CRM na Mão">
        <span class="brand-logo"><img src="assets/logo.webp" alt="CRM na Mão" /></span>
      </a>
    </div>
  </header>

  <!-- ===== FORMULÁRIO DE CADASTRO (PRODUTO LIVRE) ===== -->
  <section class="compra">
    <div class="container">
      <div class="compra-card">
        <a href="index.html" class="compra-voltar">&larr; Voltar para o site</a>

        <div class="compra-head">
          <p class="eyebrow"><span class="eyebrow-line"></span> CADASTRO</p>
          <h1>Preencha seus dados</h1>
          <p>Selecione o curso desejado e preencha seus dados abaixo. Nossa equipe vai entrar em contato para confirmar os detalhes e o pagamento.</p>
        </div>

        <form id="formCadastro" novalidate>
          <div class="form-group">
            <label for="curso">Qual curso você está comprando?</label>
            <select id="curso" name="curso" autocomplete="off" required></select>
            <span class="form-error"></span>
          </div>

          <div class="form-group" id="produtoGroup">
            <label for="produto">Qual produto você está comprando?</label>
            <textarea id="produto" name="produto" rows="3" placeholder="Descreva o produto, curso ou mentoria que deseja" required></textarea>
            <span class="form-error"></span>
          </div>

          <div class="form-group">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome completo" autocomplete="name" required />
            <span class="form-error"></span>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" placeholder="voce@email.com" autocomplete="email" required />
              <span class="form-error"></span>
            </div>

            <div class="form-group">
              <label for="whatsapp">WhatsApp</label>
              <input type="tel" id="whatsapp" name="whatsapp" placeholder="(00) 00000-0000" autocomplete="tel" required />
              <span class="form-error"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric" required />
            <span class="form-error"></span>
          </div>

          <div class="form-group">
            <label for="endereco">Endereço completo</label>
            <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro, cidade, CEP" autocomplete="street-address" required />
            <span class="form-error"></span>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="estado">Estado</label>
              <input type="text" id="estado" name="estado" placeholder="Ex: São Paulo" autocomplete="address-level1" required />
              <span class="form-error"></span>
            </div>

            <div class="form-group">
              <label for="pais">País</label>
              <input type="text" id="pais" name="pais" placeholder="Ex: Brasil" autocomplete="country-name" required />
              <span class="form-error"></span>
            </div>
          </div>

          <div class="form-group form-group-checkbox">
            <label class="checkbox-label" for="termos">
              <input type="checkbox" id="termos" name="termos" required />
              <span>Li e aceito o <a href="termos.html" target="_blank" rel="noopener">Termo de Uso</a> da CRM na Mão.</span>
            </label>
            <span class="form-error"></span>
          </div>

          <button type="submit" id="cadastroSubmit" class="btn btn-primary btn-lg compra-submit">
            Enviar cadastro
          </button>
          <p id="cadastroStatus" class="compra-status" role="status"></p>
        </form>
      </div>
    </div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="container">
      <div class="footer-logo">
        <img src="assets/logo.webp" alt="Logo CRM na Mão" style="height: 64px; width: auto; margin: 0 auto;" />
      </div>
      <div class="footer-bottom">
        <p>&copy; <span id="year"></span> CRM na Mão. Todos os direitos reservados.</p>
      </div>
    </div>
  </footer>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
  <script src="js/cadastro.js"></script>
</body>
</html>
