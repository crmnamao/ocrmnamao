<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plataforma do Aluno | CRM na Mão</title>
  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,600;1,700&family=Inter+Tight:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="plat-body">

  <!-- ===== TOPBAR ===== -->
  <header class="plat-topbar">
    <a href="index.html" class="brand" aria-label="CRM na Mão">
      <span class="brand-logo"><img src="assets/logo.webp" alt="CRM na Mão" /></span>
      <span class="brand-name">CRM na Mão</span>
    </a>

    <nav class="nav plat-nav" aria-label="Navegação do site">
      <a href="index.html">Início</a>
      <a href="index.html#planos">Planos</a>
      <a href="index.html#perguntas">Dúvidas frequentes</a>
    </nav>

    <div class="plat-usuario">
      <a href="https://wa.me/5516997296208?text=Ol%C3%A1!%20Preciso%20de%20suporte%20na%20Plataforma%20do%20Aluno%20da%20CRM%20na%20M%C3%A3o." target="_blank" rel="noopener" class="plat-btn-feedback" id="btnFaleComAGente">Fale com a gente</a>
      <button type="button" class="plat-btn-feedback" id="btnAbrirFeedback">Feedback</button>

      <div class="plat-notif" id="notifWrapper">
        <button type="button" class="plat-notif-sino" id="btnNotificacoes" aria-label="Notificações">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9.5a6 6 0 0112 0c0 4.2 1.2 5.6 1.9 6.3.3.3.1.9-.4.9H4.5c-.5 0-.7-.6-.4-.9.7-.7 1.9-2.1 1.9-6.3z" />
            <path d="M10 19a2 2 0 004 0" />
          </svg>
          <span class="plat-notif-badge" id="notifBadge" hidden>0</span>
        </button>
        <div class="plat-notif-painel" id="notifPainel" hidden></div>
      </div>

      <div class="plat-userdrop" id="userDropWrapper">
        <button type="button" class="plat-userdrop-trigger" id="btnUserDrop" aria-label="Menu do usuário" aria-haspopup="true" aria-expanded="false">
          <div class="plat-avatar" id="userAvatar"></div>
          <div class="plat-usuario-info">
            <span class="plat-usuario-nome" id="userNome"></span>
            <span class="plat-usuario-email" id="userEmail"></span>
          </div>
        </button>
        <div class="plat-userdrop-painel" id="userDropPainel" hidden>
          <button type="button" class="plat-userdrop-item" id="btnAbrirPerfil">Meu perfil</button>
          <button type="button" class="plat-userdrop-item plat-userdrop-sair" id="btnSair">Sair</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== SHELL: SIDEBAR + CONTEÚDO ===== -->
  <div class="plat-shell">
    <aside class="plat-sidebar" id="plataformaSidebar" aria-label="Edições e estações"></aside>
    <main class="plat-main" id="plataformaMain"></main>
  </div>

  <!-- ===== MODAL DO QUIZ ===== -->
  <div class="quiz-overlay" id="quizOverlay" hidden></div>

  <!-- ===== MODAL DO PERFIL ===== -->
  <div class="quiz-overlay" id="perfilOverlay" hidden></div>

  <!-- ===== MODAL DO FEEDBACK ===== -->
  <div class="quiz-overlay" id="feedbackOverlay" hidden></div>

  <script src="js/admin-config.js"></script>
  <script src="js/plataforma-dados.js"></script>
  <script src="js/alunos-store.js"></script>
  <script src="js/feedback-store.js"></script>
  <script src="js/plataforma.js"></script>
  <script src="js/plataforma-extra.js"></script>
</body>
</html>
